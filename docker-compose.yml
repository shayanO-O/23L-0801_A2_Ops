services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: visionguard:latest
    container_name: visionguard-web
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MODEL_MODE=local
      - DATABASE_URL=postgresql://visionuser:visionpass@db:5432/visionguard
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: visionguard-db
    environment:
      - POSTGRES_USER=visionuser
      - POSTGRES_PASSWORD=visionpass
      - POSTGRES_DB=visionguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionuser -d visionguard"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
